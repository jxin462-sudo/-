<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>动物ICU重症监护系统</title>
  <link rel="stylesheet" href="../../assets/common.css" />
  <link rel="stylesheet" href="assets/index.css" />
  <link rel="stylesheet" href="../../../lanhu-fit.css" />
  <script src="../../../lanhu-fit.js" defer></script>
  <script src="../../../lanhu-settings-field.js" defer></script>
  <script src="../../../lanhu-hospital-info.js" defer></script>
  <script src="../../../lanhu-bridge.js" defer></script>
</head>
<body>
<div class="page flex-col">
    <div class="box_1 flex-row">
      <img
        class="label_1"
        referrerpolicy="no-referrer"
        src="./assets/img/6ab826399b33bfd6620d290cbcfb398b.png"
      />
      <span class="text_1">动物ICU重症监护系统</span>
      <img
        class="thumbnail_1"
        referrerpolicy="no-referrer"
        src="./assets/img/b131053a1523255bb37532d6849b0900.png"
      />
      <span class="text_2">动物样本</span>
      <div class="group_1 flex-row">
        <img
          class="image_1"
          referrerpolicy="no-referrer"
          src="./assets/img/c37747caeff875f5c64e99a3822f0bd9.png"
        />
        <span class="text_3">设置</span>
      </div>
      <img
        class="label_2"
        referrerpolicy="no-referrer"
        src="./assets/img/825ced7c1da5cd8e778f37001738dec8.png"
      />
      <span class="text_4" data-account-live="name">--</span>
      <img
        class="thumbnail_2"
        referrerpolicy="no-referrer"
        src="./assets/img/3a17541f3164a9ff3b6505d0bef26749.png"
      />
    </div>
    <div class="block_6 flex-col">
      <div class="group_7 flex-row justify-between">
        <div class="group_2 flex-col">
          <div class="text-wrapper_1 flex-col"><span class="text_5">医院信息</span></div>
          <span class="text_6">仪器状态</span>
          <span class="text_7">报告模版-默认</span>
          <span class="text_8">连接状态</span>
          <span class="text_9">补偿设置</span>
          <span class="text_10">其他设置</span>
          <span class="text_11">关于</span>
          <span class="text_12">管理员设置</span>
        </div>
        <div class="group_3 flex-col">
          <div class="section_1 flex-row justify-between">
            <span class="text_13">医院名称</span>
            <div class="group_4 flex-col" data-org-field="name"></div>
          </div>
          <div class="section_2 flex-row justify-between">
            <span class="text_14">医院地址</span>
            <div class="group_5 flex-col" data-org-field="address"></div>
          </div>
          <div class="section_3 flex-row justify-between">
            <span class="text_15">医院电话</span>
            <div class="group_6 flex-col" data-org-field="phone"></div>
          </div>
          <div class="section_4 flex-row justify-between">
            <span class="text_16">LOGO</span>
            <div class="text-wrapper_2 flex-col" data-org-logo-slot="settings"><span class="text_17" data-org-logo-text>+</span></div>
          </div>
          <div class="section_5 flex-row justify-between">
            <div class="text-wrapper_3 flex-col"><span class="text_18">保存</span></div>
            <div class="text-wrapper_4 flex-col"><span class="text_19">取消</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
<script>
(function () {
  var routes = {
    "ICU状态": "../lanhu_1icuzhuangtaikaobei/index.html",
    "动物样本": "../lanhu_1icuzhuangtaikaobei/index.html",
    "主机控制": "../lanhu_2zhujikongzhi/index.html",
    "实时监护": "../lanhu_3shishijianhu/index.html",
    "摄像监控": "../lanhu_4jiankong/index.html",
    "治疗记录": "../lanhu_6zhiliaojilu/index.html",
    "使用教程": "../lanhu_7jiaocheng/index.html",
    "设置": "../lanhu_81shezhi/index.html",
    "医院信息": "../lanhu_81shezhi/index.html",
    "仪器状态": "../lanhu_82shezhi/index.html",
    "报告模版-默认": "../lanhu_82shezhi/index.html",
    "连接状态": "../lanhu_84lianjiezhuangtai/index.html",
    "补偿设置": "../lanhu_85buchangshezhi/index.html",
    "其他设置": "../lanhu_86qita/index.html",
    "关于": "../lanhu_87guanyu/index.html",
    "管理员设置": "../lanhu_88guanliyuan/index.html",
    "实况": "../lanhu_4jiankong/index.html",
    "回放": "../lanhu_5jiankonghuifang/index.html",
    "登录": "../lanhu_2zhujikongzhi/index.html"
  };
  document.addEventListener('click', function (event) {
    var node = event.target;
    while (node && node !== document.body) {
      if (node.textContent) {
        var text = node.textContent.replace(/\s+/g, '').trim();
        if (routes[text]) {
          window.location.href = routes[text];
          return;
        }
      }
      node = node.parentNode;
    }
  });
})();
</script>
</body>
</html>
